name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOWORK: "off"

# Least privilege, named rather than inherited. Reported by `wfaudit` while the
# vulns lane was being added: every job here declared nothing, so all of them
# received the repository's DEFAULT token — read-only or read-write depending on
# an organisation setting this file cannot show, which means the answer to "what
# can a job in this repository reach" lived somewhere no reviewer of this file
# could read. Nothing here writes: the jobs check out, build, test and scan.
# Saying so makes the grant visible and survives the default being widened
# later.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The race detector needs cgo at test time; the library itself stays
    # CGO-free, which the cross-build job proves with CGO_ENABLED=0.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      # go.mod and not a hard-coded version, which `gofloor` reports as a
      # finding: a lane pinned beside a go.mod drifts from it silently, and the
      # toolchain decides every standard-library finding.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
      # poppler is the foreign judge: says() reads the words back out of our
      # PDF with pdftotext, so what is checked is what ANOTHER implementation
      # finds rather than what this one believes it wrote. Without it the two
      # tests that do that skip, and the lane is green over nothing.
      - name: poppler, the foreign reader of what we write
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test with coverage (race)
        env:
          RICHDOC_REQUIRE_POPPLER: "1"
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - name: Enforce coverage floor (94%)
        # Unlike this org's other converters, this package walks a doctree
        # whose exact shape it doesn't control (github.com/go-docutils/docutils
        # is a separate, independently evolving engine) with the same
        # defensive `ok`-checked type assertions used throughout — a floor,
        # not 100%, matches docutils/rst's own documented-percentage
        # convention rather than assuming every branch is reachable. Lowered
        # from 95% once cellBlockInlines (parse.go) added its own `default:`
        # case: unlike a switch over one of richdoc's own CLOSED interfaces
        # elsewhere in this package, a doctree tag is an open string set —
        # this fallback is a genuine safety net for a FUTURE docutils tag
        # this package doesn't know about yet (the exact scenario that hit
        # three times in one day building option lists, math, and inline
        # targets), not dead code, so it stays even though nothing in the
        # current test corpus can reach it.
        run: |
          go tool cover -func=cover.out
          pct=$(go tool cover -func=cover.out | awk '/^total:/{print $3}' | tr -d '%')
          awk -v p="$pct" 'BEGIN{exit (p+0<94.0)?1:0}'

  vulns:
    # ⛔ CALLED, no longer copied. This repository piloted the lane inline —
    # sixty lines of workflow and the reasoning behind every one of them — and
    # that was the right way to land something that had never run in this
    # organisation. It is the wrong way to keep it: the copy that drifts is the
    # one nobody reads, and the pilot had already drifted by the time latex and
    # richdoc called the shared one (which now follows the caller's go.mod and
    # builds its tools with GOTOOLCHAIN=auto, neither of which this copy did).
    #
    # The definition, and the measurements that justify each decision in it,
    # live in go-richdoc/.github/.github/workflows/vulns.yml.
    uses: go-richdoc/.github/.github/workflows/vulns.yml@main

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      # ⛔ goos and goarch SEPARATELY, not one "linux/amd64" string split in
      # the shell. The step used to do
      #
      #     export GOOS=$(echo "${{ matrix.target }}" | cut -d/ -f1)
      #
      # which actionlint reports as SC2155: `export X=$(...)` masks the
      # pipeline's exit status, so a failed split leaves GOOS empty and `go
      # build` silently builds for the HOST while the job reports that it
      # cross-built for s390x. This repository is where that was found, by
      # running actionlint against it from another repository's lane — nothing
      # here runs actionlint, so nobody had seen it. The matrix carries the two
      # values, GitHub substitutes them into the environment, and no shell
      # parses anything.
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
